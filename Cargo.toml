[package]
name = "sea-query-common-like"
version = "1.1.2"
authors = ["mpyw <mpyw628@gmail.com>"]
edition = "2021"
rust-version = "1.80.0"
description = "A Rust crate for enhancing sea_query with typical LIKE search support, including escape sequences for patterns (%fuzzy%, prefix%, %suffix) and multi-column fuzzy search."
repository = "https://github.com/mpyw/sea-query-common-like"
license = "MIT"
include = ["/src", "LICENSE"]
keywords = ["sea-orm", "sea-query", "sql", "LIKE", "search"]
categories = ["database", "web-programming"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
with-sea-orm = ["dep:sea-orm"]

[dependencies]
fancy-regex = { version = ">=0.13, <0.20", default-features = false }
regex = { version = "1", default-features = false, features = ["unicode-gencat"] }
sea-orm = { version = ">=1.0, <1.2", default-features = false, optional = true }
sea-query = { version = ">=0.31, <0.33", default-features = false }

[dev-dependencies]
sea-orm = { version = ">=1.0, <1.2", features = ["macros"] }
sea-query = ">=0.31, <0.33"
sqlformat = ">=0.3.5, <0.6"
# No code here uses `sqlx`. It is present so the compatibility matrix resolves a
# real driver alongside this crate. Reach the Postgres driver through the
# `postgres` feature, not through a direct `sqlx-postgres` dependency. A direct
# dependency does not compile on 0.9. `sqlx` turns on `sqlx-core/offline`. That
# feature adds `Executor::describe` to the trait. `sqlx-postgres/offline` stays
# off, so the impl is missing.
sqlx = { version = ">=0.7, <0.10", features = ["postgres"] }
