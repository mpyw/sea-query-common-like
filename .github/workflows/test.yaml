name: "Test"

on: [push]

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  # ===========================================================================
  # Every dependency combination this crate supports, on the compiler its users
  # have.
  #
  # Stable, not nightly. A compatibility matrix answers "can someone use this",
  # and the answer for a released dependency is the answer on a released
  # compiler. `sea-orm 1.0` pins `sqlx ^0.7`, `sqlx-postgres 0.7.4` is the last
  # of that line, and it does not compile on a nightly that has the never type
  # fallback change (rust-lang/rust#148922). Nothing anyone can do about that:
  # the code is upstream's and that line is finished. Running this on nightly
  # made the matrix fail for a reason this repository cannot act on.
  # ===========================================================================
  rust-test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sea:
          - { sea-orm: "1.0", sea-query: "0.31" }
          - { sea-orm: "1.1", sea-query: "0.32" }
        use-sea-orm:
          - true
          - false
        sqlx:
          - "0.7"
          - "0.8"
        exclude:
          # `sea-orm 1.0` requires `sqlx ^0.7`, and both lines bring their own
          # `libsqlite3-sys`, which links the same native library. Cargo cannot
          # resolve the two together.
          - sea: { sea-orm: "1.0", sea-query: "0.31" }
            use-sea-orm: true
            sqlx: "0.8"
          - sea: { sea-orm: "1.1", sea-query: "0.32" }
            sqlx: "0.7"
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Update dependencies
        run: |
          cargo remove sea-orm sea-query
          cargo remove --dev sea-orm sea-query sqlx
          cargo add sea-query@${{ matrix.sea.sea-query }} --no-default-features
          cargo add --dev sea-query@${{ matrix.sea.sea-query }}
          if [ "${{ matrix.use-sea-orm }}" == "true" ]; then
            cargo add sea-orm@${{ matrix.sea.sea-orm }} --no-default-features --optional
            cargo add --dev sea-orm@${{ matrix.sea.sea-orm }} --features macros
          fi
          cargo add --dev sqlx@${{ matrix.sqlx }} --features postgres
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## \`Cargo.toml\`
          \`\`\`toml
          $(cat Cargo.toml)
          \`\`\`
          EOF
      - name: Generate feature flags
        id: generate-flags
        run: |
          if [ "${{ matrix.use-sea-orm }}" == "true" ]; then
            echo "feature_flags=--all-features" >> "$GITHUB_OUTPUT"
          else
            echo "feature_flags=" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore cache
        uses: Swatinem/rust-cache@v2
      - name: Check code (dependencies only)
        run: cargo check ${{ steps.generate-flags.outputs.feature_flags }}
      - name: Check code (with dev-dependencies)
        run: cargo check --all-targets ${{ steps.generate-flags.outputs.feature_flags }}
      - name: Check test
        run: cargo test ${{ steps.generate-flags.outputs.feature_flags }}

  # ===========================================================================
  # One combination on nightly, which is where a change on its way to stable
  # shows up first. This is the early warning, and it is about this crate's own
  # code: a failure here is something this repository can fix.
  #
  # No `cargo add` dance. The ranges in `Cargo.toml` resolve to the newest of
  # each dependency on their own, which is the combination worth looking ahead
  # for.
  #
  # Coverage is measured here because `cargo llvm-cov --doctests` needs
  # nightly, and one run of it says as much as several: the matrix legs run the
  # same tests over different dependency versions.
  # ===========================================================================
  nightly-and-coverage:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Install coverage tools
        run: |
          rustup component add llvm-tools-preview --toolchain nightly
          cargo +nightly install cargo-llvm-cov
      - name: Restore cache
        uses: Swatinem/rust-cache@v2
      - name: Check code (with dev-dependencies)
        run: cargo +nightly check --all-targets --all-features
      - name: Check test, with coverage
        run: cargo +nightly llvm-cov --all-features --doctests --lcov >> /tmp/coverage.lcov
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          files: /tmp/coverage.lcov

  rust-lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install cargo-sort
        run: cargo install cargo-sort
      - name: Setup nightly cargo fmt
        run: rustup toolchain install nightly --component rustfmt
      - name: Restore cache
        uses: Swatinem/rust-cache@v2
      - name: Check format
        run: cargo +nightly fmt --all -- --check
      - name: Check clippy
        run: cargo clippy --all-features -- -D warnings
      - name: Check sort
        run: cargo sort -w -c
